name: Manual Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Links to GitHub Environments for audit logs & approvals
    environment: 
      name: ${{ github.event.inputs.environment }}
    
    steps:
